name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # de hora a hora, para atualizar as notícias e a lista de emissoras
  workflow_dispatch:
    inputs:
      teste_push:
        description: 'Enviar uma notificação de teste de cada categoria para os telemóveis registados'
        type: boolean
        default: false
      teste_tempo:
        description: 'Enviar uma notificação de teste de cada estado do tempo (chuva, sol, frio, vento, nevoeiro, nublado)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # não interromper a meio do envio das notificações

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recolher notícias
        run: node scripts/fetch-news.mjs
        continue-on-error: true
      - name: Enviar avisos de greve para os telemóveis
        run: node scripts/send-push.mjs
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          PUSH_TEST: ${{ inputs.teste_push && '1' || '' }}
          PUSH_TEST_TEMPO: ${{ inputs.teste_tempo && '1' || '' }}
      - name: Recolher emissoras portuguesas
        run: node scripts/fetch-stations.mjs
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
