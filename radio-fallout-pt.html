<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rádio Fallout PT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" />
<style>
html, body { margin: 0; min-height: 100%; background: #0a0d0a; color-scheme: dark; }
body { display: flex; align-items: center; justify-content: center; padding: 12px 0;
  background: radial-gradient(ellipse at 50% 0%, #1a2019, #050605 70%); }
#radio { width: 100%; }
/* Rádio em painéis: PRESET à esquerda, mostrador verde iluminado, botões com anel, medidor de agulha */
.rf-root {
  --rf-screen: #030603;
  --rf-green: #22ff66;
  --rf-green2: #00e676;
  --rf-dim: #0f7a35;
  --rf-ring: #0c2a16;
  --rf-needle: #ff2a2a;
  --rf-amber: #ffb000;
  --rf-body1: #2a2e29;
  --rf-body2: #151714;
  font-family: 'Share Tech Mono', 'VT323', ui-monospace, 'Courier New', monospace;
  color: var(--rf-green);
  max-width: 980px;
  margin: 0 auto;
  padding: 12px;
  box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
}
.rf-root *, .rf-root *::before, .rf-root *::after { box-sizing: border-box; }
.rf-chassis {
  position: relative; padding: 16px; border-radius: 18px;
  background:
    repeating-linear-gradient(97deg, #ffffff05 0 1px, transparent 1px 4px),
    radial-gradient(60% 40% at 20% 10%, #4a4f4733, transparent 70%),
    radial-gradient(50% 50% at 85% 90%, #00000099, transparent 70%),
    linear-gradient(150deg, var(--rf-body1), var(--rf-body2));
  border: 1px solid #070807; box-shadow: inset 0 1px 0 #ffffff14, 0 12px 34px #000000cc;
}
.rf-grid { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.rf-panelbox { background: var(--rf-screen); border-radius: 26px; box-shadow: inset 0 0 0 1px #000, inset 0 0 26px #000, 0 1px 0 #ffffff14; }

/* Painel PRESET */
.rf-left { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rf-title { text-align: center; font-family: 'Arial Black', Impact, 'Share Tech Mono', sans-serif; font-style: italic; font-weight: 900;
  font-size: clamp(34px, 7vw, 58px); line-height: 1; letter-spacing: .02em; color: transparent; -webkit-text-stroke: 1.5px var(--rf-green);
  filter: drop-shadow(0 0 5px #22ff6666); transform: skewX(-8deg); }
.rf-sel { display: flex; align-items: center; gap: 8px; }
.rf-sel button { flex: none; width: 46px; height: 32px; font: inherit; font-size: 22px; line-height: 1; cursor: pointer; color: var(--rf-green);
  background: transparent; border: 2px solid var(--rf-green); border-radius: 3px; }
.rf-sel button:first-child { clip-path: polygon(28% 0, 100% 0, 100% 100%, 28% 100%, 0 50%); padding-left: 12px; border-left-width: 0;
  background: linear-gradient(var(--rf-green), var(--rf-green)) left / 0 no-repeat; box-shadow: inset 3px 0 0 transparent; }
.rf-sel button:last-child { clip-path: polygon(0 0, 72% 0, 100% 50%, 72% 100%, 0 100%); padding-right: 12px; border-right-width: 0; }
.rf-sel button:first-child, .rf-sel button:last-child { background: #0a2a14; }
.rf-sel button:active { background: var(--rf-green); color: #031006; }
.rf-name { flex: 1; min-width: 0; text-align: center; font-size: 17px; letter-spacing: .08em; text-transform: uppercase;
  text-shadow: 0 0 8px #22ff6677; overflow-wrap: anywhere; }
.rf-art { position: relative; flex: 1; min-height: 230px; border: 2px solid var(--rf-green); border-radius: 18px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px; }
.rf-artsvg::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, #030603aa 0 1px, transparent 1px 4px); }
.rf-artsvg { position: relative; width: min(62%, 190px); aspect-ratio: 1; color: var(--rf-green); filter: drop-shadow(0 0 8px #22ff6655); transition: opacity .3s; }
.rf-artsvg svg { width: 100%; height: 100%; display: block; }
.rf-off .rf-artsvg { opacity: .18; }
.rf-status { font-size: 11px; letter-spacing: .16em; color: var(--rf-dim); text-align: center; }
.rf-status.live { color: var(--rf-green); text-shadow: 0 0 6px #22ff6688; }
.rf-status.conn { color: var(--rf-amber); }
.rf-status.bad { color: var(--rf-needle); }
.rf-genre { font-size: 12px; color: var(--rf-green2); opacity: .8; text-align: center; overflow-wrap: anywhere; }

.rf-site { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .12em; text-align: center; color: var(--rf-green); text-decoration: underline; text-underline-offset: 3px; }
.rf-site:focus-visible { outline: 2px solid var(--rf-green); outline-offset: 2px; }

/* Coluna direita */
.rf-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.rf-tuner { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.rf-screen { position: relative; height: 150px; border-radius: 26px 26px 40px 40px / 22px 22px 30px 30px; overflow: hidden; background: #06250f;
  touch-action: none; cursor: ew-resize; box-shadow: 0 0 22px #22ff6633; transition: box-shadow .4s; }
.rf-off .rf-screen { box-shadow: none; }
.rf-screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .4s; }
.rf-off .rf-screen canvas { opacity: .16; }
.rf-screen::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, #00000014 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 60%, #00000055 100%); }
.rf-screen:focus-visible { outline: 2px solid var(--rf-green); outline-offset: 3px; }

.rf-volline { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 11px; letter-spacing: .14em; color: var(--rf-dim); }
.rf-volline i { position: relative; width: 38%; height: 3px; background: var(--rf-ring); }
.rf-volline i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--rf-green); }
.rf-volline i b::after { content: ''; position: absolute; right: -3px; top: -5px; width: 6px; height: 13px; background: var(--rf-green); }
.rf-volline span:last-child { min-width: 4ch; font-variant-numeric: tabular-nums; color: var(--rf-green2); }

.rf-mid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.rf-knobwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 9px; letter-spacing: .16em; color: #9aa093; text-align: center; }
.rf-knob { --p: 0; position: relative; width: 104px; height: 104px; border-radius: 50%; border: 0; padding: 0; background: none; touch-action: none; cursor: grab; }
.rf-knob:active { cursor: grabbing; }
.rf-knob:focus-visible { outline: 2px solid var(--rf-green); outline-offset: 3px; }
.rf-knob::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 225deg, var(--rf-green) calc(var(--p) * 270deg), var(--rf-ring) 0 270deg, transparent 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  filter: drop-shadow(0 0 4px #22ff6688); }
.rf-off .rf-knob::before { opacity: .35; }
.rf-cap { position: absolute; inset: 11%; border-radius: 50%; display: block; }
.rf-cap svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 4px #000); }
.rf-pills { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rf-pill { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: #020402;
  border: 2px solid #2a2e29; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; min-width: 0; }
.rf-pill span:last-child { font-variant-numeric: tabular-nums; }

.rf-readout { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.rf-nixie { display: flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: 10px; background: #020402; border: 2px solid #2a2e29; }
.rf-nixie input { width: 5.2ch; background: transparent; border: 0; outline: 0; padding: 0; text-align: right; font: inherit; font-size: 24px; line-height: 1;
  color: var(--rf-green); text-shadow: 0 0 8px #22ff6688; font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
.rf-nixie input:focus-visible { outline: 1px dashed var(--rf-green); outline-offset: 3px; }
.rf-nixie span { font-size: 12px; color: var(--rf-green2); letter-spacing: .1em; }
.rf-band { display: flex; border-radius: 10px; overflow: hidden; border: 2px solid #2a2e29; }
.rf-band button { font: inherit; font-size: 13px; letter-spacing: .15em; padding: 9px 13px; border: 0; cursor: pointer; color: var(--rf-dim); background: #020402; }
.rf-band button[aria-pressed="true"] { color: #031006; background: var(--rf-green); }
.rf-leds { display: flex; flex-direction: column; gap: 5px; margin-left: auto; font-size: 10px; letter-spacing: .14em; }
.rf-led { display: flex; align-items: center; gap: 6px; color: #5d6359; }
.rf-led i { width: 9px; height: 9px; border-radius: 50%; background: #0c2413; }
.rf-led.on { color: var(--rf-green); text-shadow: 0 0 6px #22ff6688; }
.rf-led.on i { background: var(--rf-green); box-shadow: 0 0 8px var(--rf-green); }

/* Medidor */
.rf-vu { padding: 8px 10px; }
.rf-vu canvas { width: 100%; height: 170px; display: block; }

/* Memórias */
.rf-presets { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.rf-presets button { font: inherit; padding: 8px 2px 6px; border-radius: 10px; cursor: pointer; color: var(--rf-green); border: 2px solid #2a2e29; background: #020402;
  display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rf-presets button:active, .rf-presets button.saved { background: var(--rf-green); color: #031006; }
.rf-presets button:active small, .rf-presets button.saved small { color: #031006; }
.rf-presets b { font-weight: normal; font-size: 14px; }
.rf-presets small { font-size: 10px; color: var(--rf-green2); font-variant-numeric: tabular-nums; }
.rf-presets button:focus-visible, .rf-band button:focus-visible, .rf-add:focus-visible, .rf-panel button:focus-visible, .rf-sel button:focus-visible { outline: 2px solid var(--rf-green); outline-offset: 2px; }
.rf-note { margin-top: 6px; font-size: 9px; letter-spacing: .1em; color: #8d9388; text-align: center; }

/* Estações personalizadas */
.rf-add { display: block; margin: 12px auto 0; font: inherit; font-size: 11px; letter-spacing: .14em; background: none; border: 0; color: #9aa093; cursor: pointer; padding: 6px; }
.rf-add:hover { color: var(--rf-green); }
.rf-panel { margin-top: 8px; padding: 12px; border-radius: 14px; background: var(--rf-screen); border: 1px solid #1d5a30; font-size: 12px; }
.rf-panel h3 { margin: 0 0 10px; font-size: 12px; font-weight: normal; letter-spacing: .14em; }
.rf-panel form { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }
.rf-panel label { display: flex; flex-direction: column; gap: 3px; font-size: 10px; letter-spacing: .12em; color: var(--rf-green2); min-width: 0; }
.rf-panel label.wide { grid-column: 1 / -1; }
.rf-panel input { font: inherit; font-size: 14px; color: var(--rf-green); background: #020402; border: 1px solid #1d5a30; border-radius: 3px; padding: 7px 8px; min-width: 0; width: 100%;
  -webkit-user-select: text; user-select: text; }
.rf-panel input:focus-visible { outline: 1px solid var(--rf-green); }
.rf-panel .rf-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rf-panel button { font: inherit; font-size: 11px; letter-spacing: .12em; padding: 7px 10px; cursor: pointer; color: var(--rf-green); background: #0a2412; border: 1px solid #1d5a30; border-radius: 3px; }
.rf-msg { font-size: 11px; color: var(--rf-amber); min-height: 1em; }
.rf-custom { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.rf-custom li { display: flex; align-items: center; gap: 8px; }
.rf-custom li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rf-custom li button { color: var(--rf-needle); border-color: #5a1d14; background: #240a06; }

@media (max-width: 860px) {
  .rf-root { padding: 8px; }
  .rf-chassis { padding: 10px; border-radius: 14px; }
  .rf-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .rf-right { gap: 10px; }
  .rf-panelbox { border-radius: 18px; }
  .rf-left { padding: 12px 10px 10px; gap: 8px; }
  .rf-art { min-height: 0; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 10px 12px; }
  .rf-artsvg { width: 84px; flex: none; }
  .rf-artinfo { min-width: 0; }
  .rf-status, .rf-genre, .rf-site { text-align: left; }
  .rf-tuner { padding: 10px; }
  .rf-screen { height: 130px; }
  .rf-knob { width: 78px; height: 78px; }
  .rf-mid { gap: 8px; }
  .rf-pill { padding: 8px 9px; font-size: 11px; letter-spacing: .04em; }
  .rf-vu canvas { height: 130px; }
  .rf-panel form { grid-template-columns: minmax(0, 1fr); }
}

/* Ecrã inicial: um toque liga o rádio e começa a tocar */
.rf-start { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  border: 0; border-radius: inherit; cursor: pointer; font: inherit; color: var(--rf-green); background: #020402d9; padding: 16px; text-align: center; }
.rf-start b { font-weight: normal; font-size: clamp(16px, 4vw, 24px); letter-spacing: .12em; padding: 14px 20px; border: 2px solid var(--rf-green); border-radius: 12px;
  background: #0a2a14; text-shadow: 0 0 8px #22ff6688; box-shadow: 0 0 18px #22ff6644; }
.rf-start span { font-size: 12px; letter-spacing: .08em; color: var(--rf-green2); }
.rf-start:focus-visible b { outline: 2px solid var(--rf-green); outline-offset: 4px; }

</style>
</head>

    const pct = (state.volAngle + 135) / 270;
    el.vol.style.setProperty('--p', pct.toFixed(4));
    el.volbar.style.width = `${Math.round(pct * 100)}%`;
    el.volpct.textContent = `${Math.round(pct * 100)}%`;
    const on = state.volAngle > -128;
    if (on !== state.on) setPower(on);
    if (on) { state.lastVolAngle = state.volAngle; save('rf_last_vol', Math.round(state.volAngle)); }
  }

  function setPower(on) {
    state.on = on;
    chassis.classList.toggle('rf-off', !on);
    el.ledpwr.classList.toggle('on', on);
    if (on) { el.start.hidden = true; ensureAudio(); primeAudio(); state.status = ''; setStatus('static'); }
    else { setStation(null); state.status = ''; setStatus('off'); state.gain = 0; }
    showIdle();
    needsDraw = true;
  }

  function renderPresets() {
    el.presets.innerHTML = '';
    state.presets.forEach((f, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `<b>${i + 1}</b><small>${Number(f).toFixed(1)}</small>`;
      b.setAttribute('aria-label', `Memória ${i + 1}: ${Number(f).toFixed(1)} MHz`);
      let timer = null; let held = false;
      b.addEventListener('pointerdown', () => {
        held = false;
        timer = setTimeout(() => {
          held = true;
          if (state.band !== 'FM') return;
          state.presets[i] = Math.round(state.freq.FM * 10) / 10;
          save('rf_presets_v2', state.presets);
          renderPresets();
          const nb = el.presets.children[i];
          nb.classList.add('saved'); setTimeout(() => nb.classList.remove('saved'), 700);
        }, 650);
      });
      const cancel = () => clearTimeout(timer);
      b.addEventListener('pointerup', cancel); b.addEventListener('pointerleave', cancel); b.addEventListener('pointercancel', cancel);
      b.addEventListener('click', () => {
        if (held) return;
        if (state.band !== 'FM') setBand('FM');
        state.vel = 0; state.target = state.presets[i];
      });
      el.presets.appendChild(b);
    });
  }

  function renderCustom() {
    el.custom.innerHTML = '';
    state.custom.forEach((s, i) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.textContent = `${Number(s.freq).toFixed(1)} MHz — ${s.name}`;
      const del = document.createElement('button');
      del.type = 'button'; del.textContent = 'APAGAR';
      del.addEventListener('click', () => {
        if (state.station === s) setStation(null);
        state.custom.splice(i, 1); save('rf_custom', state.custom); renderCustom(); needsDraw = true;
      });
      li.append(span, del); el.custom.appendChild(li);
    });
  }

  // ---------- Eventos ----------
  const offs = [];
  const on = (target, type, fn, opts) => { target.addEventListener(type, fn, opts); offs.push(() => target.removeEventListener(type, fn, opts)); };

  // Arrastar a agulha no visor (com inércia)
  let drag = null;
  on(el.screen, 'pointerdown', (e) => {
    el.screen.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, t: performance.now() }; state.vel = 0; state.target = null;
  });
  on(el.screen, 'pointermove', (e) => {
    if (!drag) return;
    const b = band();
    const per = (b.max - b.min) / (W - pad() - 22);
    const now = performance.now();
    const dx = e.clientX - drag.x; const dt = Math.max(1, now - drag.t) / 1000;
    setFreq(state.freq[state.band] + dx * per);
    state.dragVel = (dx * per) / dt;
    drag.x = e.clientX; drag.t = now;
  });
  const endDrag = () => {
    if (!drag) return;
    if (performance.now() - drag.t < 80) { const lim = (band().max - band().min) * 0.2; state.vel = clamp((state.dragVel || 0) * 0.6, -lim, lim); }
    drag = null; state.dragVel = 0;
  };
  on(el.screen, 'pointerup', endDrag); on(el.screen, 'pointercancel', endDrag);

  // Botões rotativos: o ângulo do ponteiro em relação ao centro
  function knob(node, onDelta, onTap) {
    let k = null;
    const ang = (e) => {
      const r = node.getBoundingClientRect();
      return (Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180) / Math.PI;
    };
    on(node, 'pointerdown', (e) => { node.setPointerCapture(e.pointerId); k = { a: ang(e), moved: 0, t: performance.now() }; });
    on(node, 'pointermove', (e) => {
      if (!k) return;
      const a = ang(e);
      let d = a - k.a; if (d > 180) d -= 360; if (d < -180) d += 360;
      const now = performance.now();
      k.moved += Math.abs(d);
      onDelta(d, Math.max(1, now - k.t) / 1000);
      k.a = a; k.t = now;
    });
    const end = () => { if (k && k.moved < 4 && onTap) onTap(); k = null; };
    on(node, 'pointerup', end); on(node, 'pointercancel', () => { k = null; });
  }
  knob(el.tune, (d, dt) => {
    const delta = (d / 360) * band().turn;
    state.target = null;
    setFreq(state.freq[state.band] + delta);
    state.vel = clamp(delta / dt, -band().turn * 1.5, band().turn * 1.5) * 0.4;
  });
  on(el.tune, 'wheel', (e) => {
    e.preventDefault(); state.target = null; state.vel = 0;
    setFreq(state.freq[state.band] + (e.deltaY < 0 ? 1 : -1) * band().wheel);
  }, { passive: false });
  on(el.tune, 'keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); setFreq(state.freq[state.band] + band().step); }
    if (e.key === 'ArrowDown') { e.preventDefault(); setFreq(state.freq[state.band] - band().step); }
  });

  knob(el.vol, (d) => setVolAngle(state.volAngle + d), () => {
    if (state.on) setVolAngle(-135); else setVolAngle(state.lastVolAngle);
  });
  on(el.vol, 'wheel', (e) => { e.preventDefault(); setVolAngle(state.volAngle + (e.deltaY < 0 ? 12 : -12)); }, { passive: false });
  on(el.vol, 'keydown', (e) => {
    // Cima/baixo mexem no volume; esquerda/direita ficam sempre para a sintonia
    if (e.key === 'ArrowUp') { e.preventDefault(); setVolAngle(state.volAngle + 15); }
    if (e.key === 'ArrowDown') { e.preventDefault(); setVolAngle(state.volAngle - 15); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (state.on) setVolAngle(-135); else setVolAngle(state.lastVolAngle); }
  });

  // Setas esquerda/direita em qualquer sítio (exceto quando se escreve num campo)
  on(window, 'keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!root.isConnected || root.offsetParent === null) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); state.vel = 0; state.target = null;
      const b = band();
      const next = state.freq[state.band] + (e.key === 'ArrowRight' ? b.step : -b.step);
      setFreq(Math.round(next / b.step) * b.step);
    }
  });

  // Mostrador digital: escrever a frequência
  const applyTyped = () => {
    const v = parseFloat(el.freq.value.replace(',', '.'));
    state.vel = 0; state.target = null;
    if (Number.isFinite(v)) setFreq(v);
    el.freq.value = state.freq[state.band].toFixed(band().digits);
  };
  on(el.freq, 'keydown', (e) => { if (e.key === 'Enter') { applyTyped(); el.freq.blur(); } });
  on(el.freq, 'blur', applyTyped);
  on(el.freq, 'focus', () => el.freq.select());

  const step = (dir) => {
    const list = stations().slice().sort((x, y) => x.freq - y.freq);
    const cur = state.target != null ? state.target : state.freq.FM;
    let st = dir > 0 ? list.find((x) => x.freq > cur + 0.05) : list.slice().reverse().find((x) => x.freq < cur - 0.05);
    if (!st) st = dir > 0 ? list[0] : list[list.length - 1];
    if (state.band !== 'FM') setBand('FM');
    state.vel = 0; state.target = st.freq;
  };
  on(el.prev, 'click', () => step(-1));
  on(el.next, 'click', () => step(1));

  on(el.start, 'click', () => { el.start.hidden = true; if (!state.on) setVolAngle(state.lastVolAngle); });
  on(el.fm, 'click', () => setBand('FM'));
  on(el.am, 'click', () => setBand('AM'));

  on(el.addbtn, 'click', () => { el.panel.hidden = !el.panel.hidden; });
  on(el.form, 'submit', (e) => {
    e.preventDefault();
    const f = Math.round(parseFloat(el.nfreq.value.replace(',', '.')) * 10) / 10;
    const name = el.nname.value.trim(); const url = el.nurl.value.trim();
    let msg = '';
    if (!Number.isFinite(f) || f < 88 || f > 108) msg = 'Frequência entre 88.0 e 108.0 MHz.';
    else if (!name) msg = 'Falta o nome.';
    else if (!/^https:\/\/\S+$/i.test(url)) msg = 'O URL tem de começar por https://';
    else if (stations().some((s) => Math.abs(s.freq - f) < 0.35)) msg = 'Já existe uma estação junto a essa frequência.';
    if (msg) { el.msg.textContent = msg; return; }
    state.custom.push({ freq: f, name: name.slice(0, 40), url, genre: '' });
    save('rf_custom', state.custom);
    el.form.reset(); el.msg.textContent = `Guardada em ${f.toFixed(1)} MHz.`;
    renderCustom(); needsDraw = true;
  });

  on(window, 'resize', resize);
  on(window, 'online', () => { if (state.on && state.station && state.status !== 'live') { retryDelay = 3000; startStream(state.station); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { needsDraw = true; });

  // ---------- Ciclo ----------
  let raf = 0; let lastT = performance.now();
  function frame(now) {
    if (destroyed) return;
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (state.target != null) {
      const diff = state.target - state.freq.FM;
      if (Math.abs(diff) < 0.004) { setFreq(state.target); state.target = null; } else setFreq(state.freq.FM + diff * Math.min(1, dt * 7));
    } else if (!drag && Math.abs(state.vel) > band().step * 0.05) {
      setFreq(state.freq[state.band] + state.vel * dt, true);
      state.vel *= Math.exp(-4.5 * dt);
    } else if (!drag) state.vel = 0;
    updateAudio();
    if (needsDraw) { drawDial(); needsDraw = false; }
    drawScope(now / 1000);
    raf = requestAnimationFrame(frame);
  }

  el.volcap.innerHTML = gearSvg('#22ff66'); el.tunecap.innerHTML = gearSvg('#22ff66');
  renderPresets(); renderCustom();
  {
    const first = stations().find((x) => Math.abs(x.freq - state.freq.FM) <= LOCK);
    if (first) el.startinfo.textContent = `Começa em ${first.name} · ${first.freq.toFixed(1)} MHz`;
  }
  setBand('FM'); setVolAngle(-135);
  resize();
  raf = requestAnimationFrame(frame);

  return function destroy() {
    destroyed = true;
    cancelAnimationFrame(raf);
    offs.forEach((f) => f());
    stopStream();
    if (ctx) ctx.close().catch(() => {});
    root.innerHTML = '';
  };
}

mountRadio(document.getElementById('radio'));
</script>
</body>
</html>
